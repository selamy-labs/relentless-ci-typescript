name: Relentless trusted policy

"on":
  repository_dispatch:
    types: [relentless-policy-reevaluate]

permissions:
  contents: read

concurrency:
  group: trusted-policy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  issue:
    name: Trusted policy issuer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: trusted-policy-issuer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build protected issuer before App credentials
        run: |
          npm ci --ignore-scripts
          npx tsc -p tsconfig.quality.json
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.RELENTLESS_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELENTLESS_POLICY_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Evaluate protected policy and publish App check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELENTLESS_POLICY_APP_ID: ${{ vars.RELENTLESS_POLICY_APP_ID }}
        run: node .quality-build/quality/trusted-policy/issuer-main.js

name: Relentless CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  analysis:
    name: Full analysis (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: "2026.9.16"
          sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518
          install_args: --locked
          cache: false
          env: false
          github_token: ""
      - name: Full local command, including every mutant
        run: npm run verify
      - name: Retain raw verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analysis-node-${{ matrix.node }}
          path: |
            .quality-results/tests.json
            .quality-results/*secrets.json
            .quality-results/dependencies.json
            .quality-results/static-security.json
            .quality-results/workflows-security.json
            .quality-results/documentation.json
            .quality-results/duplication/**/*.json
            .quality-results/mutation*.json
            .quality-results/mutation-events/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Installed behavior (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check dependency policy before installation
        run: npm run dependency-policy
      - name: Locked installation without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Product build
        run: npm run build
      - name: Product unit, property and CLI behavior
        run: npm test -- tests/intervals.test.ts tests/properties.test.ts tests/cli.test.ts tests/main.test.ts
      - name: Native archive and isolated installed consumer
        run: npm run package:check

  gate:
    name: Relentless CI gate
    if: ${{ always() }}
    needs: [analysis, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix result
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$ANALYSIS_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
